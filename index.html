<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Showground Autojumble Live</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans pb-12">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-30 shadow-md">
    <div class="max-w-3xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <span class="text-amber-500 font-bold text-xl tracking-wide uppercase">Autojumble Live</span>
      </div>
      <button onclick="loadMasterJSON()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs py-1.5 px-3 rounded transition flex items-center gap-1 border border-slate-600">
        <span>↻ Refresh</span>
      </button>
    </div>
  </header>

  <main class="max-w-3xl mx-auto px-4 mt-4 space-y-4">

    <!-- Event Banner -->
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-4 shadow-xl flex justify-between items-center">
      <div>
        <span class="text-xs text-amber-400 font-mono font-semibold uppercase">Event Marketplace</span>
        <h1 class="text-xl font-bold text-white">Showground Parts & Click/Collect</h1>
        <p class="text-xs text-slate-400 mt-0.5">Browse live listings or reserve before walking the field.</p>
      </div>
      <button onclick="exportJSON()" class="bg-slate-700 hover:bg-slate-600 text-slate-300 text-[11px] font-mono py-1 px-2.5 rounded border border-slate-600 transition">
        Export JSON
      </button>
    </div>

    <!-- Category Filters -->
    <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
      <button onclick="filterCategory('All', event)" class="cat-btn active-cat bg-amber-500 text-slate-900 font-bold text-xs px-3.5 py-1.5 rounded-full whitespace-nowrap transition">All Parts</button>
      <button onclick="filterCategory('Engine', event)" class="cat-btn bg-slate-800 text-slate-300 hover:bg-slate-700 border border-slate-700 text-xs px-3.5 py-1.5 rounded-full whitespace-nowrap transition">Engine & Drivetrain</button>
      <button onclick="filterCategory('Bodywork', event)" class="cat-btn bg-slate-800 text-slate-300 hover:bg-slate-700 border border-slate-700 text-xs px-3.5 py-1.5 rounded-full whitespace-nowrap transition">Bodywork & Trim</button>
      <button onclick="filterCategory('Wheels', event)" class="cat-btn bg-slate-800 text-slate-300 hover:bg-slate-700 border border-slate-700 text-xs px-3.5 py-1.5 rounded-full whitespace-nowrap transition">Wheels & Tyres</button>
      <button onclick="filterCategory('Wanted', event)" class="cat-btn bg-slate-800 text-slate-300 hover:bg-slate-700 border border-slate-700 text-xs px-3.5 py-1.5 rounded-full whitespace-nowrap transition">Parts Wanted</button>
    </div>

    <!-- Parts List Container -->
    <div id="partsContainer" class="space-y-3">
      <!-- Dynamic listings injected here -->
    </div>

  </main>

  <script>
    let globalPartsData = [];
    let currentCategory = 'All';

    document.addEventListener('DOMContentLoaded', () => {
      loadMasterJSON();
    });

    // Fetches live parts.json with cache-busting timestamp
    async function loadMasterJSON() {
      const container = document.getElementById('partsContainer');
      const targetJson = `./parts.json?t=${Date.now()}`;

      try {
        const response = await fetch(targetJson, { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
        
        globalPartsData = await response.json();
        renderListings();
      } catch (err) {
        console.error('Error loading parts.json:', err);
        if (container) {
          container.innerHTML = `
            <div class="p-6 rounded-xl border border-amber-800/60 bg-slate-800 text-amber-200 text-xs text-center space-y-2">
              <p class="font-bold">Master <code>parts.json</code> file not found.</p>
              <p class="text-slate-400">Make sure <code>parts.json</code> is saved in the same GitHub repository root folder as this HTML file.</p>
            </div>`;
        }
      }
    }

    function renderListings() {
      const container = document.getElementById('partsContainer');
      if (!container) return;

      const filtered = currentCategory === 'All' 
        ? globalPartsData 
        : globalPartsData.filter(p => p.category.toLowerCase().includes(currentCategory.toLowerCase()) || currentCategory.toLowerCase().includes(p.category.toLowerCase()));

      if (filtered.length === 0) {
        container.innerHTML = `<p class="text-slate-500 text-xs italic text-center py-8 bg-slate-800 rounded-xl border border-slate-700">No parts currently listed in this category.</p>`;
        return;
      }

      container.innerHTML = filtered.map(p => {
        const isWanted = p.category === 'Wanted';
        const isSold = p.status && p.status.toUpperCase() === 'SOLD';
        
        const msgText = encodeURIComponent(`Hi, I saw your listing for "${p.title}" on the Autojumble App. Is it still available to view today at ${p.location}?`);
        const whatsappUrl = `https://wa.me/${formatPhoneForWA(p.phone)}?text=${msgText}`;
        const smsUrl = `sms:${p.phone}?body=${msgText}`;

        // Format price cleanly
        let displayPrice = p.price ? p.price.toString().trim() : 'Offers';
        if (!displayPrice.startsWith('£') && !displayPrice.toLowerCase().includes('offer')) {
          displayPrice = '£' + displayPrice;
        }

        return `
          <div class="bg-slate-800 border ${isSold ? 'border-slate-700/40 opacity-60' : isWanted ? 'border-amber-500/50 bg-amber-500/5' : 'border-slate-700'} rounded-xl p-4 shadow-md space-y-2">
            <div class="flex justify-between items-start gap-2">
              <div>
                <span class="inline-block text-[10px] font-semibold px-2 py-0.5 rounded ${isSold ? 'bg-slate-700 text-slate-400' : isWanted ? 'bg-amber-500 text-slate-900' : 'bg-slate-700 text-amber-400'} mb-1">
                  ${isSold ? 'SOLD' : escapeHtml(p.category)}
                </span>
                <h3 class="text-sm font-bold ${isSold ? 'line-through text-slate-400' : 'text-white'} leading-tight">${escapeHtml(p.title)}</h3>
              </div>
              <span class="text-sm font-extrabold ${isSold ? 'text-slate-500' : 'text-amber-400'} font-mono whitespace-nowrap">${escapeHtml(displayPrice)}</span>
            </div>

            <p class="text-slate-300 text-xs leading-relaxed">${escapeHtml(p.desc || 'No description provided.')}</p>

            <div class="pt-2 border-t border-slate-700/60 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
              <span class="text-[11px] text-slate-400 flex items-center gap-1">
                <svg class="w-3.5 h-3.5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path></svg>
                ${escapeHtml(p.location)}
              </span>

              ${isSold ? `
                <span class="text-xs text-slate-500 font-semibold italic">Item Collected</span>
              ` : `
                <div class="flex gap-2 w-full sm:w-auto">
                  <a href="${smsUrl}" class="flex-1 sm:flex-none text-center bg-slate-700 hover:bg-slate-600 text-slate-200 text-[11px] font-semibold py-1 px-3 rounded border border-slate-600 transition">
                    SMS
                  </a>
                  <a href="${whatsappUrl}" target="_blank" class="flex-1 sm:flex-none text-center bg-emerald-600 hover:bg-emerald-500 text-white text-[11px] font-semibold py-1 px-3 rounded transition">
                    WhatsApp / Reserve
                  </a>
                </div>
              `}
            </div>
          </div>
        `;
      }).join('');
    }

    function filterCategory(cat, e) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.classList.remove('bg-amber-500', 'text-slate-900', 'font-bold');
        btn.classList.add('bg-slate-800', 'text-slate-300');
      });

      if (e && e.target) {
        e.target.classList.remove('bg-slate-800', 'text-slate-300');
        e.target.classList.add('bg-amber-500', 'text-slate-900', 'font-bold');
      }
      
      renderListings();
    }

    function exportJSON() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(globalPartsData, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "parts.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function formatPhoneForWA(phone) {
      if (!phone) return '';
      let cleaned = phone.replace(/\D/g, '');
      if (cleaned.startsWith('0')) cleaned = '44' + cleaned.substring(1);
      return cleaned;
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
